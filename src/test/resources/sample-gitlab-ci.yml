# Simple GitLab CI template without anchors
variables:
  DOCKER_REGISTRY: registry.example.com
  APP_VERSION: "1.0.0"

stages:
  - build
  - test
  - deploy

build-app:
  stage: build
  image: docker:20.10.16
  script:
    - docker build -t $DOCKER_REGISTRY/app:$APP_VERSION .
    - docker push $DOCKER_REGISTRY/app:$APP_VERSION

test-unit:
  stage: test
  image:
    name: node:18-alpine
    entrypoint: [""]
  script:
    - npm test

deploy-staging:
  stage: deploy
  image: alpine:3.16
  script:
    - kubectl apply -f deployment.yml
  only:
    - develop